# Speed budgets, checked on every CI run by tools/budgets.py (docs/testing.md). Each budget
# is the baseline a CI runner measured and a tolerance: a run fails when a number is worse
# than baseline * (1 + tolerance). Timings on shared runners are noisy, so their tolerance
# is wide (+50%; +100% for the emulator and for the few-millisecond ones); sizes are exact, so theirs is narrow (+2%).
# `python3 tools/budgets.py HOST --update` writes what a run measured as the baselines; do it
# from a CI run's numbers (the job summary has them), not from a laptop's.

# Cold start: process start (a new page on the web) to the first commit applied, the
# counter's dev build.
["web.cold_start_ms"]
baseline = 33.5
tolerance = 1.0

["ios.cold_start_ms"]
baseline = 714.1
tolerance = 0.5

["macos.cold_start_ms"]
baseline = 198.8
tolerance = 1.0

["linux.cold_start_ms"]
baseline = 84.5
tolerance = 1.0

["android.cold_start_ms"]
baseline = 614.6
tolerance = 1.0

# Edit to change on screen under `ui serve`: a source file changed until `ui agent` sees the
# new tree (a build, and a reload or a restart in the app).
["web.edit_ms"]
baseline = 1530.3
tolerance = 0.5

["ios.edit_ms"]
baseline = 1608.8
tolerance = 0.5

["macos.edit_ms"]
baseline = 1011.8
tolerance = 0.5

["linux.edit_ms"]
baseline = 919.9
tolerance = 0.5

["android.edit_ms"]
baseline = 1037.9
tolerance = 1.0

# Frame time p95 of the benchmark scene (tests/bench: 300 rows rendered and committed per
# frame), the core's render and the host's apply, a dev build at -O0.
["web.frame_p95_ms"]
baseline = 8.000
tolerance = 0.5

["ios.frame_p95_ms"]
baseline = 20.6
tolerance = 0.5

["macos.frame_p95_ms"]
baseline = 18.0
tolerance = 0.5

["linux.frame_p95_ms"]
baseline = 6.020
tolerance = 1.0

["android.frame_p95_ms"]
baseline = 55.3
tolerance = 1.0

# The first contentful paint of examples/counter's release page in headless Chrome on a slow
# network (DevTools' "Slow 4G"): the prerendered first frame, before the module loads.
["web.first_paint_ms"]
baseline = 204.0
tolerance = 0.5

# The release web module (app.wasm) in bytes.
["web.wasm_bytes.counter"]
baseline = 107015
tolerance = 0.02

["web.wasm_bytes.kit_gallery"]
baseline = 172356
tolerance = 0.02

# The recording renderer (tests/benchmark.esk at -O2), no host: a frame over 1000 rows,
# and mounting and reversing 10,000.
["model.frame_p95_ms.rows1000"]
baseline = 1.900
tolerance = 1.0

["model.mount_ms.rows10000"]
baseline = 38.0
tolerance = 0.5

["model.reverse_ms.rows10000"]
baseline = 27.6
tolerance = 0.5
