<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}}</title>
<base href="{{base}}">
<style>
  html, body { height: 100%; margin: 0; }
  body { font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #app button { font: inherit; border: 0; cursor: pointer; }
  #app input { font: inherit; border: 1px solid #d1d5db; border-radius: 6px; outline-color: #6366f1; }
</style>
<div id="app"></div>
<script type="module">
  // The page `ui build web` makes for an app: the app fills the window.
  import createApp from './app.mjs';
  import {createHost, uiDispatch} from './renderer.mjs';
  import {createFrameScheduler} from './scheduler.mjs';
  import {setupNative} from './native.mjs';
  const root = document.querySelector('#app');
  // Native code (native/web): views by type, and events on channels for use_native_event.
  const views = {};
  const emit = (channel, payload = '') => {
    if (app) app.ccall('ui_dispatch_native', null, ['string', 'string'], [String(channel), String(payload)]);
  };
  setupNative({registerView: (type, factory) => { views[type] = factory; }, emit});
  let app;
  const host = createHost(root, (...event) => uiDispatch(app, ...event), views);
  const scheduler = createFrameScheduler(() => app._ui_tick());
  host.schedule = () => scheduler.request();
  host.cancel = () => scheduler.cancel();
  app = await createApp({uiHost: host, uiEmit: emit});
  // The page's route is the link the app was opened with (the first Navigator shows it).
  app.ccall('ui_report_link', null, ['string'], [host.route()]);
  app._ui_start(0);
  const reportWindow = () => app._ui_report_window(innerWidth, innerHeight, Math.round(devicePixelRatio * 100));
  reportWindow();
  addEventListener('resize', reportWindow);
  if (new URLSearchParams(location.search).has('shot')) {
    const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
    await frame(); await frame(); await frame();
    window.webkit?.messageHandlers?.results?.postMessage({status: 'PASS'});
  }
</script>
</html>
