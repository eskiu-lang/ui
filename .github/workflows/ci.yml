name: CI

on:
  push:
  pull_request:

# A newer push to a branch stops the run of the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          # Straight from the release, as install.sh does (the site can refuse CI runners).
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Tests
        run: tools/ci.sh
      - name: API reference is current
        run: python3 -I tools/gen_api.py --check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Tests
        run: tools/ci.sh

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          mkdir -p "$HOME/.eskiu"
          curl -fsSL -o eskiuc.zip https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-windows-x86_64.zip
          unzip -q eskiuc.zip -d "$HOME/.eskiu"
          cygpath -w "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: The WebView2 host builds and is packaged
        run: |
          # The web part goes through a stand-in compiler (no emscripten); the host is
          # compiled for real with MinGW and the WebView2 SDK the tool fetches.
          mkdir -p build
          eskiuc tools/ui/main.esk -o build/ui.exe
          eskiuc tests/fake_eskiuc.esk -o build/fake_eskiuc.exe
          (cd build && ./ui.exe new newapp --ui "$PWD/..")
          (cd build/newapp && ESKIUC="$PWD/../fake_eskiuc.exe" ../ui.exe release windows --webview)
          for f in newapp.exe WebView2Loader.dll web/index.html; do
            test -f "build/newapp/build/ui/windows/$f" || { echo "FAIL: no $f"; exit 1; }
          done
          test -f build/newapp/build/ui/release/newapp-0.1.0-windows.zip || { echo "FAIL: no zip"; exit 1; }
          echo "PASS ui release windows"
      - name: A web app builds with the WebView2 host
        run: |
          (cd examples/webapp && ../../build/ui.exe build windows)
          for f in webapp.exe WebView2Loader.dll frontend/index.html; do
            test -f "examples/webapp/build/ui/windows/$f" || { echo "FAIL: no $f"; exit 1; }
          done
          echo "PASS ui build windows (web app)"

  # The host checks (docs/testing.md): every `ui agent` op, the ui tests and the speed
  # budgets on a headless Chrome, the macOS AppKit host, the Linux GTK host, the Win32 host,
  # the iOS simulator and the Android emulator.
  host-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache
      - name: Host checks and budgets
        env:
          UI_CHROME: google-chrome
          # The runner's kernel gives Chrome no user namespaces for its sandbox.
          UI_CHROME_ARGS: --no-sandbox
        run: tools/ci_host.sh web
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-web-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            build/agent-web
          if-no-files-found: ignore

  host-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu and llvm-mingw
        run: |
          mkdir -p "$HOME/.eskiu"
          curl -fsSL -o eskiuc.zip https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-windows-x86_64.zip
          unzip -q eskiuc.zip -d "$HOME/.eskiu"
          cygpath -w "$HOME/.eskiu/bin" >> $GITHUB_PATH
          # The MinGW-w64 toolchain Eskiu's installer uses, pinned and checked.
          v=20261020
          curl -fsSL -o tc.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip"
          echo "fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd  tc.zip" | sha256sum -c -
          unzip -q tc.zip -d "$HOME"
          cygpath -w "$HOME/llvm-mingw-$v-ucrt-x86_64/bin" >> $GITHUB_PATH
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-windows-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: Host checks and budgets
        run: tools/ci_host.sh windows
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-windows-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/windows/app.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            examples/*/build/ui/windows/app.log
            build/agent-windows
          if-no-files-found: ignore

  host-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-ios-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: Boot a simulator
        run: |
          # The first available iPhone, booted and waited for.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()')
          echo "Booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Host checks and budgets
        run: tools/ci_host.sh ios
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-ios-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            build/agent-ios
          if-no-files-found: ignore

  host-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-macos-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: Host checks and budgets
        run: tools/ci_host.sh macos
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-macos-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/macos/app.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            examples/*/build/ui/macos/app.log
            build/agent-macos
          if-no-files-found: ignore

  host-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: GTK 4 and a virtual display
        run: |
          # Without the manual pages' index and the recommended packages: a minute, not four.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libwebkit2gtk-4.1-dev xvfb xauth libgl1-mesa-dri > /dev/null
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-linux-x86_64-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: Host checks and budgets
        # The GTK host's window on Xvfb, with a session bus for GTK's settings and AT-SPI.
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" tools/ci_host.sh linux
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-linux-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/linux/app.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            examples/*/build/ui/linux/app.log
            build/agent-linux
          if-no-files-found: ignore

  host-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Eskiu
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-android-x86_64-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: The emulator's snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis
      - name: Make the snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Made the snapshot"
      - name: Host checks and budgets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: tools/ci_host.sh android
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-android-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            build/agent-android
          if-no-files-found: ignore
