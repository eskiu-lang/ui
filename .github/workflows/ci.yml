name: CI

on:
  push:
  pull_request:

# A newer push to a branch stops the run of the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          # Straight from the release, as install.sh does (the site can refuse CI runners).
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Tests
        run: tools/ci.sh
      - name: API reference is current
        run: python3 -I tools/gen_api.py --check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Tests
        run: tools/ci.sh

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          mkdir -p "$HOME/.eskiu"
          curl -fsSL -o eskiuc.zip https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-windows-x86_64.zip
          unzip -q eskiuc.zip -d "$HOME/.eskiu"
          cygpath -w "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: The Windows host builds and is packaged
        run: |
          # The web part goes through a stand-in compiler (no emscripten); the host is
          # compiled for real with MinGW and the WebView2 SDK the tool fetches.
          mkdir -p build
          eskiuc tools/ui/main.esk -o build/ui.exe
          eskiuc tests/fake_eskiuc.esk -o build/fake_eskiuc.exe
          (cd build && ./ui.exe new newapp --ui "$PWD/..")
          (cd build/newapp && ESKIUC="$PWD/../fake_eskiuc.exe" ../ui.exe release windows)
          for f in newapp.exe WebView2Loader.dll web/index.html; do
            test -f "build/newapp/build/ui/windows/$f" || { echo "FAIL: no $f"; exit 1; }
          done
          test -f build/newapp/build/ui/release/newapp-0.1.0-windows.zip || { echo "FAIL: no zip"; exit 1; }
          echo "PASS ui release windows"

  # The host checks (docs/testing.md): every `ui agent` op, the ui tests and the speed
  # budgets on a headless Chrome, the iOS simulator and the Android emulator.
  host-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache
      - name: Host checks and budgets
        env:
          UI_CHROME: google-chrome
          # The runner's kernel gives Chrome no user namespaces for its sandbox.
          UI_CHROME_ARGS: --no-sandbox
        run: tools/ci_host.sh web
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-web-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            build/agent-web
          if-no-files-found: ignore

  host-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-ios-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: Boot a simulator
        run: |
          # The first available iPhone, booted and waited for.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit()')
          echo "Booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Host checks and budgets
        run: tools/ci_host.sh ios
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-ios-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            build/agent-ios
          if-no-files-found: ignore

  host-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Eskiu
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
      - name: Yoga, compiled once
        uses: actions/cache@v4
        with:
          path: ~/.eskiu/cache
          key: yoga-android-x86_64-${{ hashFiles('tools/ui/yoga.esk') }}
      - name: The emulator's snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis
      - name: Make the snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Made the snapshot"
      - name: Host checks and budgets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: tools/ci_host.sh android
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-android-logs
          path: |
            tests/*/build/ui/agent/*.log
            tests/*/build/ui/test
            examples/*/build/ui/agent/*.log
            build/agent-android
          if-no-files-found: ignore
